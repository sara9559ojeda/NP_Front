name: Web CI
on:
  pull_request:
  push:
    branches: [main, feature/web-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:mojibake
      - run: npm test
      - run: npm run test:proxy
      - run: npm run build
